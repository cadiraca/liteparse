[package]
name = "liteparse-server"
version = "2.17.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP API server for LiteParse"
publish = false

[[bin]]
name = "liteparse-server"
path = "src/main.rs"

[features]
default = ["tesseract"]
tesseract = ["liteparse/tesseract"]

[dependencies]
liteparse = { package = "liteparse", version = "2.17.0", path = "../liteparse", default-features = false }
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
